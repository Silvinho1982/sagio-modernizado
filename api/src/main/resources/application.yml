server:
  port: ${PORT:8080}
spring:
  application:
    name: sagio-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sagio}
    username: ${SPRING_DATASOURCE_USERNAME:sagio}
    password: ${SPRING_DATASOURCE_PASSWORD:sagio_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
springdoc:
  swagger-ui:
    path: /swagger-ui.html