services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sagio
      POSTGRES_USER: sagio
      POSTGRES_PASSWORD: sagio_dev
    ports: ["5432:5432"]
    volumes: ["sagio-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sagio -d sagio"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  sagio-db:
